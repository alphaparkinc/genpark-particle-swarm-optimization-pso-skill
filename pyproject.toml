[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-particle-swarm-optimization-pso-skill"
version = "1.0.0"
description = "Continuous domain Particle Swarm Optimization (PSO) with inertia weight decay and cognitive/social acceleration."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-particle-swarm-optimization-pso-skill"
Repository = "https://github.com/alphaparkinc/genpark-particle-swarm-optimization-pso-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-particle-swarm-optimization-pso-skill/issues"
